services:
  postgres:
    image: postgres:17-alpine
    container_name: pageturners-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pageturners
      POSTGRES_USER: pageturners
      POSTGRES_PASSWORD: pageturners
    ports:
      - "5432:5432"
    volumes:
      - pageturners_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pageturners -d pageturners"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pageturners_pgdata:
